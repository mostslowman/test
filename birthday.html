<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 生日快乐</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'ZCOOL XiaoWei',serif}

.page{
  position:fixed;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity 1s ease;
}
.page.active{opacity:1;pointer-events:all}

/* ========== 背景 ========== */
.bg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center}
.bg::after{content:'';position:absolute;inset:0}

#page1 .bg{
  background-image:url('https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Warm%20romantic%20birthday%20celebration%20background%2C%20soft%20pink%20and%20golden%20bokeh%20lights%2C%20floating%20colorful%20balloons%2C%20confetti%2C%20gentle%20gradient%20soft%20pink%20to%20warm%20peach%2C%20dreamy%20atmosphere%2C%20realistic%20photography%20style%2C%20high%20quality&image_size=landscape_16_9');
  background-color:linear-gradient(135deg,#fce4ec,#f8bbd0,#f48fb1);
}
#page1 .bg::after{background:linear-gradient(135deg,rgba(255,182,193,0.3),rgba(255,218,233,0.2),rgba(245,197,66,0.15))}

#page2 .bg{
  background-image:url('https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Cozy%20warm%20birthday%20background%2C%20vintage%20paper%20texture%2C%20soft%20golden%20light%20rays%2C%20scattered%20rose%20petals%2C%20delicate%20floral%20decorations%2C%20romantic%20heartwarming%20atmosphere%2C%20soft%20focus%20bokeh%2C%20realistic%20photography%20style%2C%20high%20quality&image_size=landscape_16_9');
  background-color:#fff5eb;
}
#page2 .bg::after{background:linear-gradient(180deg,rgba(139,90,43,0.25),rgba(255,248,240,0.15),rgba(139,90,43,0.2))}

#page3 .bg{
  background-image:url('https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Festive%20birthday%20celebration%20background%2C%20colorful%20confetti%20falling%2C%20golden%20sparkles%2C%20vibrant%20balloons%20pink%20purple%20gold%2C%20party%20streamers%2C%20celebration%20lights%2C%20joyful%20festive%20atmosphere%2C%20realistic%20photography%20style%2C%20high%20quality&image_size=landscape_16_9');
  background-color:#4a1942;
}
#page3 .bg::after{background:linear-gradient(135deg,rgba(100,50,120,0.35),rgba(200,100,150,0.2),rgba(80,30,100,0.3))}

/* ========== 粒子 ========== */
.particles{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.particle{position:absolute;animation:fall linear infinite;opacity:0.7}
@keyframes fall{
  0%{transform:translateY(-30px) rotate(0deg);opacity:0.8}
  100%{transform:translateY(105vh) rotate(360deg);opacity:0}
}

/* ========== 第一页：信封 ========== */
.envelope-wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}

.envelope{position:relative;width:400px;height:290px;animation:envFloat 3s ease-in-out infinite}
@keyframes envFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

.env-body{
  position:absolute;bottom:0;width:100%;height:210px;
  background:linear-gradient(145deg,#fce4ec,#f8bbd0 45%,#f48fb1);
  border-radius:0 0 14px 14px;
  box-shadow:0 20px 60px rgba(233,30,120,0.22),0 4px 20px rgba(0,0,0,0.08);
}
.env-body::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#f5c542,transparent)}
.env-body::after{content:'';position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:55%;height:1px;background:linear-gradient(90deg,transparent,rgba(233,30,120,0.18),transparent)}

.env-flap{position:absolute;top:0;width:100%;height:160px;overflow:hidden}
.env-flap-tri{
  position:absolute;top:0;
  width:0;height:0;
  border-left:200px solid transparent;border-right:200px solid transparent;border-top:145px solid #f8bbd0;
  filter:drop-shadow(0 -3px 8px rgba(233,30,120,0.08));
}
.env-flap-tri::after{content:'';position:absolute;top:-145px;left:-200px;width:400px;height:145px;background:linear-gradient(180deg,rgba(255,255,255,0.35),transparent)}

.env-heart-wrap{position:absolute;top:100px;left:50%;transform:translateX(-50%);z-index:10}
.env-heart{
  width:70px;height:70px;background:none;border:none;cursor:pointer;
  position:relative;display:flex;align-items:center;justify-content:center;
}
.env-heart svg{width:58px;height:58px;filter:drop-shadow(0 4px 14px rgba(233,30,120,0.45));transition:transform .2s}
.env-heart:hover svg{transform:scale(1.15)}
.env-heart::after{
  content:'';position:absolute;width:90px;height:90px;border-radius:50%;
  background:radial-gradient(circle,rgba(233,30,120,0.3),transparent 70%);
  animation:heartGlow 1.5s ease-in-out infinite;
}
@keyframes heartGlow{0%,100%{transform:scale(1);opacity:0.5}50%{transform:scale(1.5);opacity:0}}

.env-deco{position:absolute;pointer-events:none}
.env-deco.a{top:35px;left:25px;font-size:20px;animation:twinkle 2s ease-in-out infinite}
.env-deco.b{top:45px;right:30px;font-size:15px;animation:twinkle 2.4s ease-in-out infinite .4s}
.env-deco.c{bottom:45px;left:35px;font-size:17px;animation:twinkle 2.2s ease-in-out infinite .2s}
.env-deco.d{bottom:40px;right:25px;font-size:13px;animation:twinkle 2.6s ease-in-out infinite .6s}
@keyframes twinkle{0%,100%{opacity:0.3;transform:scale(1)}50%{opacity:0.8;transform:scale(1.25)}}

.env-hint{
  margin-top:36px;color:#fff;font-size:18px;
  text-shadow:0 2px 14px rgba(0,0,0,0.35);letter-spacing:3px;
  animation:hintIn 1s ease .6s both;
}
@keyframes hintIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

/* ========== 第二页：信纸 ========== */
.letter-wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding:20px}

.letter-paper{
  position:relative;width:580px;max-width:92vw;min-height:400px;
  background:linear-gradient(170deg,#fffaf4,#fff5eb 50%,#ffefdb);
  border-radius:6px;padding:52px 50px 64px;
  box-shadow:0 25px 80px rgba(139,90,43,0.18),0 2px 8px rgba(0,0,0,0.06),inset 0 0 80px rgba(255,248,240,0.5);
  overflow:hidden;
}
.letter-paper::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#f5c542,#f8a4c8,#f5c542)}
.letter-paper::after{content:'';position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#f5c542,#f8a4c8,#f5c542)}

.lp-border{position:absolute;inset:14px;border:1.5px dashed rgba(212,165,116,0.35);border-radius:4px;pointer-events:none}
.lp-lines{position:absolute;inset:52px 50px 64px;background:repeating-linear-gradient(transparent,transparent 36px,rgba(200,180,150,0.18) 36px,rgba(200,180,150,0.18) 37px);pointer-events:none}

.lp-corner{position:absolute;width:30px;height:30px;opacity:0.45}
.lp-corner.tl{top:20px;left:20px;border-top:2px solid #f8a4c8;border-left:2px solid #f8a4c8}
.lp-corner.tr{top:20px;right:20px;border-top:2px solid #f8a4c8;border-right:2px solid #f8a4c8}
.lp-corner.bl{bottom:20px;left:20px;border-bottom:2px solid #f8a4c8;border-left:2px solid #f8a4c8}
.lp-corner.br{bottom:20px;right:20px;border-bottom:2px solid #f8a4c8;border-right:2px solid #f8a4c8}

.lp-text{
  position:relative;z-index:2;
  font-family:'Ma Shan Zheng',cursive;font-size:22px;line-height:2.3;
  color:#5d4037;white-space:pre-wrap;word-break:break-word;
  min-height:180px;max-height:48vh;overflow-y:auto;
}
.lp-text::-webkit-scrollbar{width:4px}
.lp-text::-webkit-scrollbar-thumb{background:#f8a4c8;border-radius:2px}

.cursor{display:inline-block;width:2px;height:24px;background:#e91e78;vertical-align:middle;margin-left:2px;animation:cursorBlink .8s step-end infinite}
@keyframes cursorBlink{0%,100%{opacity:1}50%{opacity:0}}

.lp-emoji{text-align:center;margin-top:18px;font-size:28px;letter-spacing:14px;position:relative;z-index:2}

.btn-next{
  margin-top:30px;padding:13px 44px;
  background:transparent;border:2px solid rgba(255,255,255,0.65);border-radius:28px;
  color:#fff;font-size:17px;font-family:'ZCOOL XiaoWei',serif;
  cursor:pointer;letter-spacing:4px;
  text-shadow:0 1px 10px rgba(0,0,0,0.3);backdrop-filter:blur(4px);
  transition:all .3s;
}
.btn-next:hover{background:rgba(255,255,255,0.12);border-color:#fff;transform:scale(1.06)}

/* ========== 第三页：照片+音频 ========== */
.gallery-wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%;height:100%;padding:36px 20px 24px}

.gallery-title{color:#fff;font-size:28px;text-shadow:0 2px 18px rgba(0,0,0,0.45);margin-bottom:24px;letter-spacing:5px}

.carousel-box{position:relative;width:100%;max-width:680px;flex:1;min-height:0;perspective:1200px}
.carousel-track{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.4,0,.2,1)}
.carousel-item{
  position:absolute;width:300px;height:225px;
  left:50%;top:50%;margin-left:-150px;margin-top:-112px;
  border-radius:16px;overflow:hidden;
  box-shadow:0 15px 50px rgba(0,0,0,0.45);
  transition:all .8s cubic-bezier(.4,0,.2,1);
}
.carousel-item img{width:100%;height:100%;object-fit:cover}

.carousel-dots{display:flex;gap:8px;margin-top:18px}
.cdot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.3);border:none;cursor:pointer;transition:all .3s;padding:0}
.cdot.on{background:#fff;transform:scale(1.3)}

.audio-bar{
  width:100%;max-width:420px;margin-top:auto;padding:14px 22px;
  background:rgba(255,255,255,0.1);backdrop-filter:blur(16px);
  border-radius:20px;border:1px solid rgba(255,255,255,0.12);
}
.audio-row{display:flex;align-items:center;gap:12px}
.audio-btn{
  width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,0.15);border:none;color:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;flex-shrink:0;
}
.audio-btn:hover{background:rgba(255,255,255,0.25);transform:scale(1.08)}
.audio-btn svg{width:16px;height:16px;fill:#fff}
.prog-wrap{flex:1;height:6px;background:rgba(255,255,255,0.2);border-radius:3px;cursor:pointer;overflow:hidden}
.prog-bar{height:100%;background:linear-gradient(90deg,#f8a4c8,#f5c542);border-radius:3px;width:0;transition:width .15s linear}
.audio-times{display:flex;justify-content:space-between;margin-top:7px;font-size:12px;color:rgba(255,255,255,0.65);font-variant-numeric:tabular-nums}

/* ========== 响应式 ========== */
@media(max-width:640px){
  .envelope{width:300px;height:225px}
  .env-body{height:165px}
  .env-flap-tri{border-left-width:150px;border-right-width:150px;border-top-width:110px}
  .env-flap-tri::after{top:-110px;left:-150px;width:300px;height:110px}
  .env-heart-wrap{top:80px}
  .letter-paper{padding:38px 30px 48px}
  .lp-text{font-size:18px}
  .carousel-item{width:220px;height:165px;margin-left:-110px;margin-top:-82px}
}
</style>
</head>
<body>

<!-- ==================== 第一页：信封 ==================== -->
<div id="page1" class="page active">
  <div class="bg"></div>
  <div class="particles" id="pt1"></div>
  <div class="envelope-wrap">
    <div class="envelope">
      <div class="env-flap"><div class="env-flap-tri"></div></div>
      <div class="env-body"></div>
      <div class="env-heart-wrap">
        <button class="env-heart" id="goPage2" title="打开祝福">
          <svg viewBox="0 0 24 24" fill="#e91e63"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </button>
      </div>
      <span class="env-deco a">✨</span>
      <span class="env-deco b">⭐</span>
      <span class="env-deco c">💫</span>
      <span class="env-deco d">✨</span>
    </div>
    <p class="env-hint">点击心形打开祝福 ✉️</p>
  </div>
</div>

<!-- ==================== 第二页：信纸 ==================== -->
<div id="page2" class="page">
  <div class="bg"></div>
  <div class="particles" id="pt2"></div>
  <div class="letter-wrap">
    <div class="letter-paper">
      <div class="lp-border"></div>
      <div class="lp-lines"></div>
      <div class="lp-corner tl"></div>
      <div class="lp-corner tr"></div>
      <div class="lp-corner bl"></div>
      <div class="lp-corner br"></div>
      <div class="lp-text" id="letterText"></div>
      <div class="lp-emoji">🎂 🎁 🎈</div>
    </div>
    <button class="btn-next" id="goPage3">下一页 →</button>
  </div>
</div>

<!-- ==================== 第三页：照片+音频 ==================== -->
<div id="page3" class="page">
  <div class="bg"></div>
  <div class="particles" id="pt3"></div>
  <div class="gallery-wrap">
    <h2 class="gallery-title">🎉 生日快乐 🎉</h2>
    <div class="carousel-box" id="carouselBox">
      <div class="carousel-track" id="carouselTrack"></div>
    </div>
    <div class="carousel-dots" id="carouselDots"></div>
    <div class="audio-bar" id="audioBar" style="display:none">
      <div class="audio-row">
        <button class="audio-btn" id="audioToggle">
          <svg viewBox="0 0 24 24" id="audioIcon"><polygon points="5,3 19,12 5,21"/></svg>
        </button>
        <div class="prog-wrap" id="progWrap">
          <div class="prog-bar" id="progBar"></div>
        </div>
      </div>
      <div class="audio-times">
        <span id="tCur">0:00</span>
        <span id="tDur">0:00</span>
      </div>
    </div>
  </div>
</div>

<audio id="bgAudio" preload="auto"></audio>

<script>
(function(){
  var letterText = '亲爱的朋友，\n祝你生日快乐！\n愿你的每一天都充满阳光和欢笑，\n愿你的梦想都能实现！\n\n在这个特别的日子里，\n愿所有的美好都属于你！🎂';
  var photos = [];
  var audioData = null;
  var twTimer = null;
  var cIndex = 0;
  var cTimer = null;
  var isPlaying = false;

  function $(id){ return document.getElementById(id) }

  function go(name){
    document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active') });
    $(name).classList.add('active');
  }

  // 页面跳转
  $('goPage2').addEventListener('click', function(){
    go('page2');
    startTypewriter();
  });

  $('goPage3').addEventListener('click', function(){
    go('page3');
    startCarousel();
    startAudio();
  });

  // 打字机
  function startTypewriter(){
    if(twTimer) clearInterval(twTimer);
    var el = $('letterText');
    el.innerHTML = '';
    var i = 0;
    twTimer = setInterval(function(){
      if(i < letterText.length){
        var html = esc(letterText.substring(0, i+1)) + '<span class="cursor"></span>';
        el.innerHTML = html;
        el.scrollTop = el.scrollHeight;
        i++;
      } else {
        clearInterval(twTimer);
        twTimer = null;
        el.innerHTML = esc(letterText);
      }
    }, 300);
  }

  function esc(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  // 3D 环形照片
  function startCarousel(){
    if(cTimer) clearInterval(cTimer);
    var track = $('carouselTrack');
    var dots = $('carouselDots');
    track.innerHTML = '';
    dots.innerHTML = '';

    var items = photos.length > 0 ? photos : defaultPhotos();
    var n = items.length;
    var step = 360 / n;
    var r = Math.min(360, n * 55);

    items.forEach(function(src, i){
      var d = document.createElement('div');
      d.className = 'carousel-item';
      d.innerHTML = '<img src="'+src+'" alt="">';
      track.appendChild(d);

      var dot = document.createElement('button');
      dot.className = 'cdot' + (i===0?' on':'');
      dot.addEventListener('click', function(){ cIndex = i; renderCarousel(n, step, r); });
      dots.appendChild(dot);
    });

    cIndex = 0;
    renderCarousel(n, step, r);

    cTimer = setInterval(function(){
      cIndex = (cIndex + 1) % n;
      renderCarousel(n, step, r);
    }, 3000);
  }

  function renderCarousel(n, step, r){
    $('carouselTrack').style.transform = 'rotateY(' + (-cIndex * step) + 'deg)';
    var items = $('carouselTrack').querySelectorAll('.carousel-item');
    items.forEach(function(el, i){
      el.style.transform = 'rotateY(' + (i * step) + 'deg) translateZ(' + r + 'px)';
      el.style.opacity = i === cIndex ? '1' : '0.55';
      el.style.zIndex = i === cIndex ? '10' : '1';
    });
    var dots = $('carouselDots').querySelectorAll('.cdot');
    dots.forEach(function(d, i){ d.classList.toggle('on', i === cIndex); });
  }

  function defaultPhotos(){
    return [
      'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Beautiful%20birthday%20cake%20with%20glowing%20candles%20pink%20frosting%20celebration%20realistic%20photography&image_size=landscape_4_3',
      'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Colorful%20birthday%20balloons%20floating%20soft%20pink%20background%20festive%20celebration%20realistic%20photography&image_size=landscape_4_3',
      'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Beautiful%20gift%20box%20pink%20ribbon%20sparkly%20background%20birthday%20present%20realistic%20photography&image_size=landscape_4_3',
      'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Birthday%20party%20confetti%20celebration%20golden%20sparkles%20festive%20atmosphere%20realistic%20photography&image_size=landscape_4_3'
    ];
  }

  // 音频
  function startAudio(){
    var audio = $('bgAudio');
    var bar = $('audioBar');
    if(!audioData){ bar.style.display = 'none'; return; }
    bar.style.display = 'block';
    audio.play().then(function(){ isPlaying = true; updateIcon(); }).catch(function(){});
  }

  $('audioToggle').addEventListener('click', function(){
    var a = $('bgAudio');
    if(isPlaying){ a.pause(); } else { a.play().catch(function(){}); }
    isPlaying = !isPlaying;
    updateIcon();
  });

  function updateIcon(){
    $('audioIcon').innerHTML = isPlaying
      ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'
      : '<polygon points="5,3 19,12 5,21"/>';
  }

  $('bgAudio').addEventListener('timeupdate', function(){
    if(!this.duration) return;
    $('progBar').style.width = (this.currentTime / this.duration * 100) + '%';
    $('tCur').textContent = fmt(this.currentTime);
    $('tDur').textContent = fmt(this.duration);
  });

  $('bgAudio').addEventListener('ended', function(){ this.currentTime = 0; this.play().catch(function(){}); });

  $('progWrap').addEventListener('click', function(e){
    var a = $('bgAudio');
    if(!a.duration) return;
    var rect = this.getBoundingClientRect();
    a.currentTime = ((e.clientX - rect.left) / rect.width) * a.duration;
  });

  function fmt(s){ var m = Math.floor(s/60), sec = Math.floor(s%60); return m+':'+(sec<10?'0':'')+sec; }

  // 粒子
  function mkParticles(id, emojis){
    var c = $(id); if(!c) return;
    for(var i=0;i<18;i++){
      var s = document.createElement('span');
      s.className = 'particle';
      s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      s.style.left = Math.random()*100+'%';
      s.style.animationDuration = (5+Math.random()*9)+'s';
      s.style.animationDelay = Math.random()*12+'s';
      s.style.fontSize = (10+Math.random()*12)+'px';
      c.appendChild(s);
    }
  }
  mkParticles('pt1',['✨','⭐','💫','🌟']);
  mkParticles('pt2',['🌸','🌺','✨','💫','🌷']);
  mkParticles('pt3',['🎉','🎊','✨','⭐','🎈','🥳']);

})();
</script>
</body>
</html>
